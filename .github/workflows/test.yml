name: Test

# On-demand / ad-hoc test workflow, kept separate from release.yml's own
# release-gate test job so it can be run without cutting a release. Two ways
# to trigger it:
#   - workflow_dispatch (optionally against a specific ref), for manual runs.
#   - push of a tag matching "ci-*" (throwaway tag, delete after) so an agent
#     without dashboard access can trigger + poll a run via the API/CLI.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
      benchmark:
        description: "Also run the benchmark suite"
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "ci-*"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu full matrix over every supported version
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          # Windows/macOS matrix edges (oldest + newest supported)
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install libarchive-tools (bsdtar) on Linux
        # A couple of tests exercise the bsdtar extraction fallback; the tar
        # family itself uses stdlib tarfile and needs no external tool.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q -rs

  # The declared floors, exercised: every runtime dependency installed AT the
  # lower bound pyproject.toml declares (`>=X.Y.0` -> `==X.Y.0`), on the oldest
  # supported Python. The matrix above only ever gets the newest releases, so a
  # floor that no longer works would otherwise go unnoticed.
  floors:
    name: Test at the declared dependency floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Install libarchive-tools (bsdtar) on Linux
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: Pin every declared dependency to its floor
        shell: python
        run: |
          import re
          import subprocess
          import sys

          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "tomli"], check=True)
          import tomli

          project = tomli.load(open("pyproject.toml", "rb"))["project"]
          specs = list(project.get("dependencies", []))
          for extra, deps in project.get("optional-dependencies", {}).items():
              if extra not in ("dev", "docs"):
                  specs += deps
          pins = []
          for spec in specs:
              m = re.match(r"^\s*([A-Za-z0-9._-]+)(\[[^\]]*\])?\s*[^;]*?>=\s*([^,;\s]+)", spec)
              if m:
                  pins.append("%s==%s" % (m.group(1), m.group(3)))
          open("floors.txt", "w").write("\n".join(pins) + "\n")
          print("\n".join(pins) or "(no floors declared)")
      - name: Install at the floors
        run: python -m pip install -c floors.txt -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q -rs

  # The glibc floor, exercised: below glibc 2.32, os.chmod(path, mode,
  # follow_symlinks=False) is unsupported for every path, not only symlinks
  # (RHEL/Rocky 8, inside the declared Python 3.9+ floor, ships glibc 2.28).
  # python:3.9-bullseye ships glibc 2.31 and the declared-floor Python
  # preinstalled, so this job proves the fix on a real old-glibc userspace
  # without a separate distro image. The container runs as root, so this is
  # also where a root-gated test (e.g. a bsdtar path that needs root) runs.
  glibc-floor:
    name: Test on glibc < 2.32 (python:3.9-bullseye)
    runs-on: ubuntu-latest
    container: python:3.9-bullseye
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Confirm the container's glibc is below 2.32
        run: |
          python3 -c "
          import os

          version = os.confstr('CS_GNU_LIBC_VERSION')
          print(version)
          major, minor = (int(part) for part in version.split()[-1].split('.')[:2])
          assert (major, minor) < (2, 32), f'expected glibc < 2.32, got {version}'
          "
      - name: Install libarchive-tools (bsdtar)
        run: apt-get update && apt-get install -y libarchive-tools
      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q -rs

  # Formatting is enforced (black), but it is not a shipping defect, so it is
  # not a release gate -- only a test.yml check.
  format:
    name: Check formatting (black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        run: python -m black --check src tests benchmarks

  # A green test suite is not a green CLI: pytest imports src/ via pythonpath,
  # never an installed distribution. Build a wheel and smoke-test it the way a
  # user would meet it (console script, python -m, shipped files, the example).
  wheel-smoke:
    name: Installed-wheel smoke test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tooling
        run: python -m pip install build
      - name: Build wheel
        run: python -m build --wheel --outdir "$RUNNER_TEMP/dist"
      - name: Install the wheel into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install "$RUNNER_TEMP"/dist/*.whl
      - name: Smoke-test the installed distribution
        run: '"$RUNNER_TEMP/smoke/bin/python" tests/smoke_installed.py'

  benchmark:
    # Perf numbers for release notes come from here, not from a developer laptop.
    # Single fixed runner; floor + newest interpreter, so results stay comparable
    # across runs. Only on request: a manual dispatch with benchmark=true, never
    # on a plain dispatch or a ci-* verification tag.
    name: Benchmark (py${{ matrix.python-version }}, ubuntu)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run benchmarks
        run: python benchmarks/run.py --save --name "pkgforge-ci-py${{ matrix.python-version }}"
      - name: Upload benchmark result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-py${{ matrix.python-version }}
          path: benchmarks/results/*.json

  docs:
    # release.yml's docs-gate blocks a release on `mkdocs build --strict`, and
    # this job runs the same check before a tag is cut.
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install package with docs tooling
        run: python -m pip install -e ".[dev,docs]"
      - name: Build docs
        run: mkdocs build --strict
