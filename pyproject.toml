[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pkgforge"
version = "0.2.0"
authors = [{ name = "jose-pr" }]
description = "Stage files into a build root and record their install metadata for packaging"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX",
    "Topic :: System :: Software Distribution",
    "Typing :: Typed",
]
# duho 0.7.8 is the first release whose run() owns the closed-pipe and config-error paths
# and that offers config_source, _traceback_env_ and Meta(literal_value=);
# anycfg reads pkgforge.cfg (0.15.1 is the release the schema is verified against).
dependencies = ["anycfg>=0.15.1,<0.16", "duho>=0.7.8,<0.8"]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0,<7"]
zstd = ["zstandard>=0.25,<0.26"]
dev = [
    "pkgforge[yaml,zstd]",
    "black>=26.1,<27; python_version >= '3.10'",
    "build",
    "pytest",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.26,<2",
]

[project.scripts]
pkgforge = "pkgforge.cli:main"

[project.urls]
Homepage = "https://github.com/jose-pr/pkgforge/"
Documentation = "https://jose-pr.github.io/pkgforge/"
Issues = "https://github.com/jose-pr/pkgforge/issues"


# Ship the consumer-facing docs inside the installed package.
[tool.hatch.build.targets.wheel]
packages = ["src/pkgforge"]
exclude = ["*.local.*", "CLAUDE*"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "pkgforge/README.md"

[tool.hatch.build.targets.sdist]
exclude = ["/.*", "/AGENTS.md", "/benchmarks", "*.local.*", "CLAUDE*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.black]
target-version = ["py39"]
