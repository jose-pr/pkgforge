# The "hello" example package, described once for pkgforge.
# `pkgforge --config pkgforge.cfg stage --init` stages every [[stage]] step below
# into the build root and records the metadata the RPM and Debian manifests use.

# Directories the package owns. Recording a file below one also records the
# directory itself (and any owned directory above it), so no step spells them out.
own = [
  "/usr/libexec/${package.name}",
  "/etc/${package.name}",
  "/usr/share/licenses/${package.name}",
  "/usr/share/doc/${package.name}",
  "/var/lib/${package.name}",
]

# Written once and reused as ${package.KEY} anywhere in this file.
[package]
name = "hello"
version = "1.0"
release = "1"
summary = "pkgforge example package"
license = "MIT"

# What an entry gets when neither a step nor a rule sets it. A file takes its
# mode from its step, so nothing depends on the permission bits of a checkout.
[defaults]
owner = "root"
group = "root"
dir_mode = "755"

# The first rule whose pattern fits a path decides: everything below
# /etc/hello is private to the adm group.
[[rules]]
match = ["/etc/${package.name}/**"]
mode = "640"
group = "adm"

[[stage]]
dir = "/var/lib/hello"
mode = "750"
group = "adm"

[[stage]]
src = "src/hello"
dest = "/usr/bin"
mode = "755"

[[stage]]
symlink = "/usr/bin/hi"
target = "hello"

[[stage]]
src = "src/helper"
dest = "/usr/libexec/hello"
mode = "4755"

[[stage]]
src = "src/hello.conf"
dest = "/etc/hello"
meta = { rpmprefix = "%config(noreplace)" }

[[stage]]
src = "src/hello.service"
dest = "/usr/lib/systemd/system"
mode = "644"

[[stage]]
src = "src/LICENSE"
dest = "/usr/share/licenses/hello"
mode = "644"
meta = { rpmprefix = "%license" }

[[stage]]
src = "src/README"
dest = "/usr/share/doc/hello"
mode = "644"
meta = { rpmprefix = "%doc" }

[[stage]]
file = "/var/log/hello.log"
mode = "640"
group = "adm"
meta = { rpmprefix = "%ghost" }
