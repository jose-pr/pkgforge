# The "hello" example package, described once for pkgforge.
# `pkgforge --config pkgforge.cfg stage --init` stages every [[stage]] step below
# into the build root and records the metadata the RPM and Debian manifests use;
# `pkgforge dbdump -f rpmspec` and `pkgforge dbdump -f debian --skeleton` write the
# spec and the debian/ files for the two packages declared here.

# Directories the package owns. Recording a file below one also records the
# directory itself (and any owned directory above it), so no step spells them out.
own = [
  "/usr/libexec/${package.name}",
  "/etc/${package.name}",
  "/usr/share/licenses/${package.name}",
  "/usr/share/doc/${package.name}-doc",
  "/var/lib/${package.name}",
]

# Written once and reused as ${package.KEY} anywhere in this file.
[package]
name = "hello"
version = "1.0"
release = "1"
arch = "all"
summary = "pkgforge example package"
description = """
A sample package whose file list, modes and owners come from a pkgforge file
DB. The hello user comes from the sysusers.d file in the package."""
license = "MIT"
maintainer = "Example Maintainer <maintainer@example.org>"

[package.debian]
section = "misc"

# A second package built from the same source: what a rule or a step assigns to
# it with `package` ships there.
[[packages]]
name = "${package.name}-doc"
summary = "pkgforge example package documentation"
description = "The README of the pkgforge example package."

# The account the package creates, which also makes the group of the same name.
# Any owner or group outside Debian's base-passwd set must be declared like this.
[[users]]
name = "${package.name}"
description = "hello example daemon"
home = "/var/lib/${package.name}"

# What an entry gets when neither a step nor a rule sets it. A file takes its
# mode from its step, so nothing depends on the permission bits of a checkout.
[defaults]
owner = "root"
group = "root"
dir_mode = "755"

# The first rule whose pattern fits a path decides: everything below
# /etc/hello is private to the adm group.
[[rules]]
match = ["/etc/${package.name}/**"]
mode = "640"
group = "adm"

# Everything under the documentation directory belongs to the second package.
[[rules]]
match = ["/usr/share/doc/${package.name}-doc", "/usr/share/doc/${package.name}-doc/**"]
package = "${package.name}-doc"

[[stage]]
dir = "/var/lib/hello"
owner = "${package.name}"
group = "${package.name}"
mode = "750"

# Created at install time by the generated tmpfiles.d file, so it is not shipped.
[[stage]]
dir = "/run/hello"
kind = "ghost"
owner = "${package.name}"
group = "${package.name}"
mode = "755"

[[stage]]
src = "src/hello"
dest = "/usr/bin"
mode = "755"

[[stage]]
symlink = "/usr/bin/hi"
target = "hello"

[[stage]]
src = "src/helper"
dest = "/usr/libexec/hello"
mode = "755"
caps = "cap_net_bind_service=ep"

[[stage]]
src = "src/hello.conf"
dest = "/etc/hello"
kind = "config-noreplace"

[[stage]]
src = "src/hello.service"
dest = "/usr/lib/systemd/system"
mode = "644"

[[stage]]
src = "src/LICENSE"
dest = "/usr/share/licenses/hello"
mode = "644"
kind = "license"

[[stage]]
src = "src/README"
dest = "/usr/share/doc/hello-doc"
mode = "644"
kind = "doc"

[[stage]]
file = "/var/log/hello.log"
mode = "640"
group = "adm"
kind = "ghost"
